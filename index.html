<style>
  :root{
    --sky-1:#eaf5ff;
    --sky-2:#fef9ec;
    --blue-deep:#1a3a6b;
    --blue:#2255a4;
    --blue-soft:#5b8fd6;
    --gold:#caa04a;
    --ink:#3a3a3a;
    --brown:#6b4a2f;
    --green:#3f8a4c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    padding:36px 14px;
    background:#dfe9ef;
    display:flex;
    justify-content:center;
    font-family:'Mukta', sans-serif;
    color:var(--ink);
  }

  .card{
    position:relative;
    width:410px;
    max-width:100%;
    border-radius:18px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 500px 300px at 50% 0%, #fff9e8 0%, var(--sky-2) 45%, var(--sky-1) 100%);
    box-shadow:0 30px 70px -25px rgba(20,40,80,0.45), 0 0 0 1px rgba(0,0,0,0.05);
  }

  .content{
    position:relative;
    z-index:2;
    padding:34px 28px 30px;
    text-align:center;
  }

  /* decorative floral corners (simplified, original illustration) */
  .corner{
    position:absolute;
    width:120px;
    height:120px;
    z-index:1;
    opacity:0.9;
    pointer-events:none;
  }
  .corner.tl{ top:-10px; left:-10px; }
  .corner.br{ bottom:-10px; right:-10px; transform:rotate(180deg); }

  .om-row{ margin-bottom:6px; }
  .om{
    font-family:'Tiro Devanagari Hindi', serif;
    font-size:26px;
    color:var(--gold);
  }
  .sanskrit{
    font-family:'Tiro Devanagari Hindi', serif;
    color:var(--brown);
    font-size:14px;
    line-height:1.7;
    margin-bottom:10px;
  }

  /* hero illustration area */
  .hero{
    position:relative;
    width:280px;
    height:270px;
    margin:4px auto 6px;
    overflow:visible;
  }
  .hero svg.decor{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    overflow:visible;
    z-index:1;
  }
  .hero-photo-wrap{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:150px;
    height:150px;
    z-index:2;
  }
  .hero-photo-ring{
    position:absolute;
    inset:-32px;
    z-index:1;
  }
  .hero-photo-ring svg{ width:100%; height:100%; display:block; overflow:visible; }
  .hero-photo{
    position:absolute;
    inset:8px;
    border-radius:50%;
    overflow:hidden;
    z-index:2;
    box-shadow:0 4px 14px rgba(20,50,90,0.25);
  }
  .hero-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .baby-name{
    font-family: 'initial';
    font-size:44px;
    color:var(--blue-deep);
    line-height:1.1;
    margin:2px 0 2px;
  }
  .baby-subline{
    font-size:14px;
    color:var(--brown);
    margin-bottom:2px;
  }
  .parents-line{
    font-size:12.5px;
    font-style:italic;
    color:var(--brown);
    margin-bottom:8px;
  }

  .welcome-line{
    font-size:15px;
    color:var(--brown);
    margin:6px 0 2px;
  }
  .baby-title{
    font-family:'Great Vibes', cursive;
    font-size:56px;
    color:var(--blue-deep);
    line-height:1.05;
    margin:2px 0 8px;
  }

  .footprints{
    font-size:16px;
    color:var(--blue-soft);
    margin-bottom:14px;
    letter-spacing:6px;
  }

  .celebrate-line{
    font-size:14.5px;
    color:var(--brown);
    line-height:1.5;
    margin-bottom:8px;
  }
  .event-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:26px;
    color:var(--blue-deep);
    letter-spacing:2px;
    margin:2px 0;
  }
  .event-sub{
    font-size:13px;
    color:var(--brown);
    margin-bottom:4px;
  }
  .joiner{
    color:var(--gold);
    font-size:15px;
    margin:2px 0;
  }
  .join-line{
    font-size:13.5px;
    color:var(--brown);
    line-height:1.5;
    margin:10px 0 18px;
  }

  /* info strip */
  .info-strip{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    background:#ffffff;
    border-radius:14px;
    padding:16px 10px;
    margin-bottom:16px;
    box-shadow:0 6px 18px -8px rgba(30,60,110,0.25);
  }
  .info-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 4px;
  }
  .info-icon{
    width:38px; height:38px;
    border-radius:50%;
    background:#eaf1fb;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  .info-icon svg{ width:18px; height:18px; }
  .info-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--blue);
    margin-bottom:2px;
  }
  .info-value{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    text-align:center;
    line-height:1.3;
  }
  .info-divider{
    width:1px;
    align-self:stretch;
    background:linear-gradient(to bottom, transparent, var(--gold), transparent);
    margin-top:6px;
  }

  /* venue box */
  .venue-box{
    background:linear-gradient(180deg,#eaf3ff,#f5faff);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    text-align:left;
    box-shadow:0 6px 18px -8px rgba(30,60,110,0.2);
  }
  .venue-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--blue);
    text-align:center;
    margin-bottom:8px;
  }
  .venue-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .venue-pin{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--blue-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .venue-pin svg{ width:16px; height:16px; }
  .venue-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:17px;
    color:var(--blue-deep);
    margin-bottom:2px;
  }
  .venue-address{
    font-size:12.5px;
    color:var(--ink);
    line-height:1.4;
  }

  /* action buttons */
  .btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-decoration:none;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    font-family:'Mukta', sans-serif;
    cursor:pointer;
    border:none;
    text-align:left;
  }
  .btn-icon{
    width:38px; height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .btn-icon svg{ width:18px; height:18px; }
  .btn-text{ flex:1; }
  .btn-title{
    font-size:14px;
    font-weight:700;
  }
  .btn-sub{
    font-size:12px;
    opacity:0.85;
    margin-top:1px;
  }
  .btn-arrow{ font-size:18px; opacity:0.7; }

  .btn-call{ background:#fdf3d9; }
  .btn-call .btn-icon{ background:#3fb04c; }
  .btn-call .btn-title{ color:var(--brown); }
  .btn-call .btn-sub{ color:var(--brown); }

  .row-2{
    display:flex;
    gap:10px;
  }
  .row-2 .btn{ margin-bottom:10px; }

  .btn-whatsapp{ background:#e6f8ea; }
  .btn-whatsapp .btn-icon{ background:#25D366; }
  .btn-whatsapp .btn-title{ color:#1f7a34; font-size:13px;}
  .btn-whatsapp .btn-sub{ color:#1f7a34; font-size:11px; }

  .btn-calendar{ background:#f1ecfc; }
  .btn-calendar .btn-icon{ background:#7c5fd6; }
  .btn-calendar .btn-title{ color:#5a3fae; font-size:13px; }
  .btn-calendar .btn-sub{ color:#5a3fae; font-size:11px; }

  .btn-directions{
    background:var(--blue-deep);
    color:#fff;
    align-items:center;
  }
  .btn-directions .btn-icon{ background:rgba(255,255,255,0.15); }
  .btn-directions .btn-title{ color:#fff; }
  .btn-directions .btn-sub{ color:#cfe0f7; font-size:11px; }

  .footer-line{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:var(--brown);
    margin-top:14px;
  }

  .editor-note{
    max-width:410px;
    margin:20px auto 0;
    font-size:12.5px;
    color:#556;
    text-align:center;
    font-family:sans-serif;
    line-height:1.6;
  }
  .editor-note code{
    background:#fff;
    padding:1px 5px;
    border-radius:4px;
    border:1px solid #ddd;
  }

  @media print{
    body{ background:#fff; padding:0; }
    .editor-note{ display:none; }
  }
</style>
</head>

<script>
(function(){
  const c = CONFIG;

  document.getElementById('welcomeLineEl').textContent = c.welcomeLine;
  document.getElementById('babyNameEl').textContent = c.babyName;
  document.getElementById('babyTitleEl').textContent = 'our ' + c.babyGender;
  document.getElementById('parentsLineEl').textContent = c.parentsLine;
  document.getElementById('eventNameEl').textContent = c.eventName;
  document.getElementById('eventSubEl').textContent = c.eventSubtitle;
  document.getElementById('joinerEl').textContent = c.eventJoiner;
  document.getElementById('eventName2El').textContent = c.eventName2;
  document.getElementById('joinLineEl').textContent = c.inviteLine;
  document.getElementById('dateEl').innerHTML = c.date + '<br>' + c.day;
  document.getElementById('timeEl').textContent = c.time;
  document.getElementById('followedByEl').innerHTML = c.followedBy + '<br>' + c.dinnerTime;
  document.getElementById('venueNameEl').textContent = c.venueName;
  document.getElementById('venueAddressEl').textContent = c.venueAddress;
  document.getElementById('hostNameEl').textContent = c.hostName;
  document.getElementById('hostPhoneEl').textContent = c.hostPhone;
  document.getElementById('footerLineEl').textContent = c.footerLine;

  // clean phone number for tel/wa links (digits only, keep leading +)
  const cleanPhone = c.hostPhone.replace(/[^\d+]/g,'');
  const waPhone = cleanPhone.replace(/^\+/,'');

  // Call button
  document.getElementById('callBtn').href = 'tel:' + cleanPhone;

  // WhatsApp button
  const waText = encodeURIComponent(c.whatsappMessage);
  document.getElementById('whatsappBtn').href = 'https://wa.me/' + waPhone + '?text=' + waText;

  // Get Directions button (Google Maps search for venue name + address)
  const mapsQuery = encodeURIComponent(c.venueName + ', ' + c.venueAddress);
  document.getElementById('directionsBtn').href = 'https://www.google.com/maps/search/?api=1&query=' + mapsQuery;

  // Calendar (.ics) button
  function pad(n){ return n.toString().padStart(2,'0'); }
  function toICSDate(dateISO, timeHHMM, addHours){
    const [y,m,d] = dateISO.split('-').map(Number);
    const [hh,mm] = timeHHMM.split(':').map(Number);
    const dt = new Date(y, m-1, d, hh, mm, 0);
    if (addHours) dt.setHours(dt.getHours() + addHours);
    return dt.getFullYear().toString() + pad(dt.getMonth()+1) + pad(dt.getDate()) + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
  }
  const dtStart = toICSDate(c.calendarDateISO, c.calendarStartTime, 0);
  const dtEnd = toICSDate(c.calendarDateISO, c.calendarStartTime, c.calendarDurationHours);
  const icsContent = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Baby Invitation//EN',
    'BEGIN:VEVENT',
    'SUMMARY:' + c.eventName + ' & ' + c.eventName2 + ' - ' + c.babyGender,
    'DTSTART:' + dtStart,
    'DTEND:' + dtEnd,
    'LOCATION:' + c.venueName + ', ' + c.venueAddress,
    'DESCRIPTION:' + c.inviteLine,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const icsBlob = new Blob([icsContent], {type: 'text/calendar'});
  document.getElementById('calendarBtn').href = URL.createObjectURL(icsBlob);

})();
</script>
