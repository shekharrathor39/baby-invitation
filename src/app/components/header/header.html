<div class="header-container text-center">
  <!-- OM -->
  <div class="om-wrapper d-flex justify-content-center align-items-center mb-3">
    <span class="ornament">✿</span>
    <span class="om-text mx-3">
      {{ ts.translate('om') }}
    </span>
    <span class="ornament">✿</span>
  </div>

  <p class="mantra-line mb-1">
    {{ ts.translate('ganesha_mantra') }}
  </p>

  <p class="mantra-line mb-4">
    {{ ts.translate('hari_mantra') }}
  </p>

  <div class="illustration-stage position-relative mx-auto">
    <!-- Left Decoration -->
    <svg class="cradle-left" viewBox="0 0 80 100">...</svg>

    <!-- Minimalist Baby Boy -->
    <div class="baby-avatar-cloud">
      <svg class="baby-illustration" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Circle -->
        <circle cx="100" cy="120" r="90" fill="#e8f0ff" opacity="0.6" stroke="none" />

        <!-- Baby Boy (centered inside circle) -->
        <g>
          <!-- Head -->
          <circle cx="100" cy="100" r="40" fill="#ffe0c2" />

          <!-- Little hair tuft -->
          <path d="M87 65 Q100 52 113 65 Q106 60 100 62 Q94 60 87 65 Z" fill="#5a3d2b" />

          <!-- Ears -->
          <circle cx="60" cy="100" r="7" fill="#ffe0c2" />
          <circle cx="140" cy="100" r="7" fill="#ffe0c2" />

          <!-- Eyes -->
          <circle cx="85" cy="98" r="3.5" fill="#3a3a3a" />
          <circle cx="115" cy="98" r="3.5" fill="#3a3a3a" />

          <!-- Cheeks -->
          <circle cx="76" cy="110" r="6" fill="#ffb6b6" opacity="0.6" />
          <circle cx="124" cy="110" r="6" fill="#ffb6b6" opacity="0.6" />

          <!-- Smile -->
          <path
            d="M88 112 Q100 121 112 112"
            stroke="#a0522d"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />

          <!-- Body / onesie -->
          <path
            d="M65 155 Q65 138 100 138 Q135 138 135 155 L135 195 Q100 208 65 195 Z"
            fill="#7ab8f5"
          />

          <!-- Onesie collar -->
          <path
            d="M88 138 Q100 147 112 138"
            stroke="#5a9bdc"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />

          <!-- Bow tie -->
          <path d="M93 145 L100 149 L107 145 L107 154 L100 149 L93 154 Z" fill="#5a9bdc" />
        </g>
      </svg>
    </div>

    <!-- Right Decoration -->
    <svg class="balloons-right" viewBox="0 0 90 120">...</svg>
  </div>
</div>
