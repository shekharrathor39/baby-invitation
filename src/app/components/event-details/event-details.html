<div class="details-card container-fluid">
  <div class="row g-0 text-center">

    <div class="col-md-4 col-12 detail-item">
      <div class="icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>

      <div class="meta-label">
        {{ ts.translate('label_date') }}
      </div>

      <div class="title-value">
        {{ ts.translate('val_date') }}
      </div>

      <div class="sub-value">
        {{ ts.translate('val_day') }}
      </div>
    </div>

    <div class="col-md-4 col-12 detail-item">
      <div class="icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>

      <div class="meta-label">
        {{ ts.translate('label_time') }}
      </div>

      <div class="title-value">
        {{ ts.translate('val_time') }}
      </div>
    </div>

    <div class="col-md-4 col-12 detail-item">
      <div class="icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>

      <div class="meta-label">
        {{ ts.translate('label_sequence') }}
      </div>

      <div class="title-value accent-blue-text">
        {{ ts.translate('val_sequence') }}
      </div>
    </div>

  </div>
</div>
