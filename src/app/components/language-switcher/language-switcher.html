<div class="switcher-container position-absolute top-0 end-0 m-3">
  <div class="toggle-btn d-flex align-items-center">
    <svg
      class="me-2"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path
        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
      ></path>
    </svg>

    <span
      class="lang-option"
      [class.active]="translationService.getCurrentLanguage()() === 'en'"
      (click)="changeLanguage('en')"
    >
      EN
    </span>

    <span class="divider mx-2">|</span>

    <span
      class="lang-option"
      [class.active]="translationService.getCurrentLanguage()() === 'hi'"
      (click)="changeLanguage('hi')"
    >
      हिन्दी
    </span>
  </div>
</div>
