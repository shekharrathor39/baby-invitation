<div
  class="action-row click-box d-flex justify-content-between align-items-center p-3"
  (click)="triggerCall()"
>
  <div class="left-side d-flex align-items-center">
    <div class="circle-phone d-flex justify-content-center align-items-center me-3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
        />
      </svg>
    </div>

    <div>
      <div class="meta-lbl text-uppercase">
        {{ ts.translate('label_call_host') }}
      </div>

      <div class="name-lbl">RATHOR RAJAN UDAYVIRSINGH</div>

      <div class="phone-lbl">
        {{ phone }}
      </div>
    </div>
  </div>

  <div class="chevron">
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.8"
    >
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </div>
</div>
